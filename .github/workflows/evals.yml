# Evals on every push and pull request; thresholds in evals/thresholds.toml.
#
# - checks: lint, tests, and the saved production generation run rescored against
#   the expected answers (no API calls);
# - retrieval: the role search over the committed chunks with the local embedding
#   model and reranker (no API calls; models and embeddings are cached);
# - generation: new redline proposals and the LLM judges, run by hand from the
#   Actions tab because they cost money; needs the ANTHROPIC_API_KEY secret.
name: evals

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      generation:
        description: "Also generate and judge new answers (API calls, about $0.6)"
        type: boolean
        default: false

env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - run: make check-generation

  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('src/lease_redflag_detector/rag/chunking.py', 'src/lease_redflag_detector/rag/retrieve.py') }}
          restore-keys: hf-models-
      - uses: actions/cache@v4
        with:
          path: data/processed/embeddings
          key: embeddings-${{ hashFiles('data/corpus/chunks.jsonl') }}
          restore-keys: embeddings-
      - run: make check-retrieval

  generation:
    if: github.event_name == 'workflow_dispatch' && inputs.generation
    needs: [checks, retrieval]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('src/lease_redflag_detector/rag/chunking.py', 'src/lease_redflag_detector/rag/retrieve.py') }}
          restore-keys: hf-models-
      - uses: actions/cache@v4
        with:
          path: data/processed/embeddings
          key: embeddings-${{ hashFiles('data/corpus/chunks.jsonl') }}
          restore-keys: embeddings-
      - run: make evals NAME=ci-${GITHUB_SHA::7} NOTE="CI run on ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-run
          path: results/rag/generation/
