# Evals on every push and pull request; thresholds in evals/thresholds.toml.
#
# - checks: lint, tests, and the saved production generation run rescored against
#   the expected answers (no API calls, under a minute);
# - fresh: on a pull request to main, new redline proposals without the judges,
#   skipped when the pull request changes only documentation;
# - generation: new redline proposals and the LLM judges, run by hand from the
#   Actions tab because they cost money.
# fresh and generation need the ANTHROPIC_API_KEY repository secret.
#
# The retrieval check is in retrieval.yml: it runs only when the search can change.
name: evals

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      generation:
        description: "Also generate and judge new answers (API calls, about $0.6)"
        type: boolean
        default: false

# One run per branch at a time: a new push cancels the run of the previous one, which
# would compete with it for the runners and the caches.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - run: make check-generation

  # On a pull request to main: new answers from the production config, without the
  # judges (about $0.07), against the looser [fresh] thresholds.
  # Whether a pull request changes only documentation: Markdown outside prompts/ (the
  # prompts are Markdown too) and docs/. Then fresh is skipped, since no new answer can
  # differ from the last one for a reason.
  changes:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      only_docs: ${{ steps.diff.outputs.only_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > changed.txt
          cat changed.txt
          # Every changed file must be documentation; prompts/ is never documentation.
          if grep -qvE '^(docs/.*|[^/]+\.md|results/.*\.md|data/README\.md)$' changed.txt \
            || grep -q '^prompts/' changed.txt; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          fi

  fresh:
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main'
      && needs.changes.outputs.only_docs != 'true'
    needs: [checks, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            data/processed/embeddings
            data/processed/rerank
          key: search-cache-${{ github.run_id }}
          restore-keys: search-cache-
      # One folder per push: a run of an earlier push to this PR may be committed.
      - run: echo "RUN_NAME=ci-pr${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: make redline NAME=$RUN_NAME NOTE="CI run on PR ${{ github.event.pull_request.number }}"
      - run: make check-fresh RUN=$(date +%F)_$RUN_NAME
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/huggingface
            data/processed/embeddings
            data/processed/rerank
          key: search-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-run
          path: results/rag/generation/

  generation:
    if: github.event_name == 'workflow_dispatch' && inputs.generation
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Models and the embedding and reranker caches; saved even if the run fails, so
      # the next one does not recompute them (see retrieval.yml).
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            data/processed/embeddings
            data/processed/rerank
          key: search-cache-${{ github.run_id }}
          restore-keys: search-cache-
      - run: make evals NAME=ci-${GITHUB_SHA::7} NOTE="CI run on ${GITHUB_SHA::7}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/huggingface
            data/processed/embeddings
            data/processed/rerank
          key: search-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-run
          path: results/rag/generation/
