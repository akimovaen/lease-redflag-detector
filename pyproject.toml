[project]
name = "lease-redflag-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lena.akimova", email = "akimova.lena.n@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lease-redflag-detector = "lease_redflag_detector:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
