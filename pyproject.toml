[project]
name = "lease-redflag-detector"
version = "0.1.0"
description = "Red flag detection in commercial lease agreements: extraction, RAG, agent, API."
readme = "README.md"
authors = [
    { name = "lena.akimova", email = "akimova.lena.n@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pillow>=12.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
