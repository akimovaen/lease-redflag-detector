# Red flag retrieval set: red flags as the stage 1 extractor returns them, and the
# passages the role search (rag/redline_search.py) must find for each of its roles.
#
# Reviewed by the landlord's lawyer on 11.11.2026.
#
# `quote` is the clause that raises the flag: Ukrainian leases as they are, other
# leases in the Ukrainian translation of data/processed/golden_hints/ (the translation
# keeps "Сторона A" / "Сторона B" where the original has Party A / Party B).
# `source` is the stage 1 text and its line, or "authored" for flags written for this set.
#
# Evidence per role: a document id and a short quote copied word for word from it. A
# retrieved chunk is relevant if it belongs to the document and contains the quote
# (case, spaces and list markers ignored), so the set scores any chunking alike.
#   position   the landlord's policy 2026
#   wording    the clause library 2026
#   law        the Civil Code (chapter 58, art. 533) and Law 543/96-ВР
#   precedent  the committee minutes; an empty list means the role must come back
#              empty: there is no precedent and anything returned is noise
# The market role (research and market leases) is background only and is not scored.
# An empty `law` list means the corpus has no act on the point; it is not scored.

