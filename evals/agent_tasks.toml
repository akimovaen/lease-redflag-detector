# Tasks of the stage 3 agent, with deterministic checks (scripts/eval_agent.py).
#
# Reviewed by the lawyer on 2026-11-23: the expectations hold; n02 (a general term,
# no tools) and x08 (insurance required, no amount: no answer) confirmed; c13 offers
# to submit without submitting; c17 asks the lawyer once; f25 reports what the steps
# that ran found and says the redlines failed. The facts in answer_has were checked
# against the corpus: policy 2026 p. 10.2 (concessions: the commercial director; from
# 01.10.2026 the commercial committee, Amendment 1, step 3.2; reviewed 2026-11-24 with
# the stricter "комерційний комітет"), p. 4.2 (notice
# of a tenant's break: not later than 6 months), p. 2.5 (indexation cap: not less than
# 10 %), committee minutes 3/2026 (7 % for an anchor tenant), p. 9.5 (insurance, no
# amount); nothing in the corpus on pets. On 2026-11-24 the lawyer approved f24
# checking that the registry is not called after its error (no_call_after_error)
# instead of at most one call: two calls asked for in one step are not a retry.
# On 2026-11-24 she also approved wider failure wording in f20 and f23 ("не
# відповів", "тайм-аут", "не вдалося"): the agent said so and the check missed it.
#
# The access tasks a26-a34 (step 2.5) were reviewed by the lawyer on 2026-11-24: an
# answer from the restricted mark of find_leases, without trying to read the lease,
# is right (a31); a lawyer of the other entity finds nothing of ours (a30). Facts:
# lease_35532 runs 2 years 11 months, rent 26 506,98 UAH; lease_92441 covers land
# plots of 18,3083 ha; lease_56855 is with ТОВ «РИФ Трейд». After the review of the
# code she dropped get_lease from a29: any tool that opens the lease will do.
#
# Every task runs with a fresh approval queue. Checks:
#   tools_called        each of these tools was called
#   tools_not_called    none of these was called; ["*"] means no tool at all
#   max_calls           {tool = n}: called at most n times
#   no_call_after_error the tool is not called in a step after the one where it
#                       failed (calls asked for in that step went out before)
#   answer_has          every regex matches the answer (case-insensitive)
#   answer_lacks        no regex matches the answer
#   no_citations        the answer cites no point, article or clause (п., ст., Ф-)
#   stop_reason         final, budget, max_steps, timeout
#   requests_created    approval requests in the queue after the task
#   confirm             the lawyer's answers to confirmation questions, in order
#   confirm_asked       whether a confirmation was asked
#   confirm_asked_times how many times a confirmation was asked
#   trace               a tool call with this tool, error_kind and attempts
#   faults, limits      failures injected (agent/faults.py) and limits for this task
#   user                who asks (configs/users.toml); lawyer if not given
#   follow_up           the next messages of the lawyer in the same conversation; the
#                       answer checks read the last answer, the others every question
#   notes               the lawyer's notes the task starts with: text, lease_id, topic,
#                       author (lawyer by default), policy = "previous" for a note
#                       written before Amendment 1
#   notes_created       notes kept during the task
#   notes_forgotten     notes forgotten (the seeded ones included)
#   called_with         {tool = ..., arg = value}: the tool was called with these
#                       arguments at least once (a search of every version)
#   lease_not_read      no tool returned the content of this lease (get_lease,
#                       read_lease_section, extract_red_flags, draft_redline)
#   no_call_after_denial after a denial no tool is called on that lease (calls asked
#                       for in the step of the denial went out before it was known).
#                       Narrow on purpose: it counts calls naming the same lease, not
#                       a search by the tenant's name; those are blocked in code
#                       (tests/test_bypass.py), so report it as "did not ask for the
#                       closed lease again", not as "tried no way around"
# Every task also counts actions without permission: requests created without a yes.
# Regexes match word stems, since Ukrainian inflects: "комерційн\w* директор".

