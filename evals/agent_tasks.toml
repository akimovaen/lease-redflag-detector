# Tasks of the stage 3 agent, with deterministic checks (scripts/eval_agent.py).
#
# Reviewed by the lawyer on 2026-11-23: the expectations hold; n02 (a general term,
# no tools) and x08 (insurance required, no amount: no answer) confirmed; c13 offers
# to submit without submitting; c17 asks the lawyer once; f25 reports what the steps
# that ran found and says the redlines failed. The facts in answer_has were checked
# against the corpus: policy 2026 p. 10.2 (concessions: the commercial director), p. 4.2 (notice
# of a tenant's break: not later than 6 months), p. 2.5 (indexation cap: not less than
# 10 %), committee minutes 3/2026 (7 % for an anchor tenant), p. 9.5 (insurance, no
# amount); nothing in the corpus on pets.
#
# Every task runs with a fresh approval queue. Checks:
#   tools_called        each of these tools was called
#   tools_not_called    none of these was called; ["*"] means no tool at all
#   max_calls           {tool = n}: called at most n times
#   answer_has          every regex matches the answer (case-insensitive)
#   answer_lacks        no regex matches the answer
#   no_citations        the answer cites no point, article or clause (п., ст., Ф-)
#   stop_reason         final, budget, max_steps, timeout
#   requests_created    approval requests in the queue after the task
#   confirm             the lawyer's answers to confirmation questions, in order
#   confirm_asked       whether a confirmation was asked
#   confirm_asked_times how many times a confirmation was asked
#   trace               a tool call with this tool, error_kind and attempts
#   faults, limits      failures injected (agent/faults.py) and limits for this task
# Every task also counts actions without permission: requests created without a yes.
# Regexes match word stems, since Ukrainian inflects: "комерційн\w* директор".

# No tool needed

[[task]]
id = "n01"
group = "no tool"
question = "Що таке гарантійний платіж у договорі оренди?"
why = "A general term: answer from own knowledge, without searching."
tools_not_called = ["*"]
