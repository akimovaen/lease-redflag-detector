# Thresholds of scripts/check_evals.py: CI fails when a metric falls below its minimum
# (or the avoid share rises above its maximum). Set a little below the current
# production numbers, so a change that makes things worse fails, and noise does not.

[retrieval]
# Role search with the production settings (rag/redline_search.py) on
# evals/redflag_retrieval.toml. Current: overall 0.95, avoid 0.00.
overall = 0.90
position = 0.90
wording = 0.85
law = 0.85
avoid_max = 0.0

[generation]
# The production generation run, rescored against evals/redline_expected.toml.
# Current (amendment-1, the redline code of stage 3: Amendment 1, p. 10.5, prompt tags):
# valid 1.00, verdict 0.92, risk 0.88, cite 1.00, faithfulness 0.75. Before it,
# 2026-11-13_haiku-v3-24 (old code): verdict 0.88, risk 0.83, faithfulness 0.73.
run = "2026-11-27_amendment-1"
valid = 1.0
verdict = 0.85
risk = 0.75
cite = 0.95
# Routing to the lawyer (an answer with any gap; scripts/eval_redline.py). Current:
# referred 0.82, no_answer 1.00 (both flags expected not_covered), referred_extra 0.15.
referred = 0.75
no_answer = 1.0
# Raised from 0.10 after the run amendment-1 gave 0.15 (2 of 13: f02 and f19, gaps
# with nothing to do with the code changed), chosen with the lawyer on 2026-11-27:
# 0.10 was set on one run with 0.00, while five runs of the same generation code
# gave 0.00-0.31 (see [fresh]); one flag is 0.08 of this score.
referred_extra_max = 0.2
# From the LLM judge (judge.json), checked only when the run was judged. Facts and
# clause are not gates: their agreement with the lawyer is too low
# (results/rag/judge_calibration.md).
faithfulness = 0.65

[fresh]
# A run CI generates on a pull request to main with the production config, unjudged.
# Generation is not deterministic and one red flag is 0.04 of a score, so verdict and
# risk are looser than for the saved run. Five runs of v3 on the same code gave verdict
# 0.79-0.88; 0.70 (17 of 24) leaves two flags of room below the lowest. valid
# and cite do not depend on the model's judgment and stay strict.
valid = 1.0
cite = 0.95
verdict = 0.70
risk = 0.70
# Routing varies more between runs: over five runs of v3 referred was 0.55-1.00 (11
# flags, one is 0.09) and referred_extra 0.00-0.31. referred was 0.65, set on four runs;
# the fifth (CI on PR #20) gave 0.55 with the same generation code, so it is now 0.45:
# it catches a prompt that stops naming gaps (v5: 0.27), not the noise.
referred = 0.45
no_answer = 0.5
referred_extra_max = 0.35

[agent]
# The final runs of the agent tasks (scripts/eval_agent.py, evals/agent_tasks.toml),
# each checked; chosen with the lawyer on 2026-11-27. Current (v5, 3 runs): passed
# 0.96-1.00, tool choice 0.97-1.00, actions without permission 0 (step 3.8; two of
# the four failures were checks too narrow, widened since). One task is 0.02 of a score.
runs = ["2026-11-27_final-v5", "2026-11-27_final-v5-r2", "2026-11-27_final-v5-r3"]
passed = 0.90
tool_choice = 0.90
# Approval requests created without the lawyer's yes: none is allowed.
unauthorized_max = 0
