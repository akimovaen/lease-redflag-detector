# Retrieval set: questions of the landlord's lawyer and the passages that answer them.
#
# Each piece of evidence is a document id and a short quote copied word for word from
# that document. A retrieved chunk is relevant if it belongs to the document and
# contains the quote (case, spaces and list markers ignored), so the same set scores
# structural and fixed-size chunks alike. Quotes are kept short, so that one of the
# overlapping fixed windows holds each of them whole.
#
# kind:
#   policy      the answer is in the landlord's policy or clause library
#   law         the answer is in an act
#   combined    the answer needs both the policy and the law
#   precedent   the answer is in the committee minutes
#   paraphrase  the question is worded unlike the document ("компенсувати ремонт"
#               for "поліпшення")
#   outdated    the 2024 policy or a repealed act answers it differently: the
#               default filter (documents in force) must leave them out
#
# Searches use the default filters (documents in force) unless `all_versions = true`.

[[question]]
id = "r01"
kind = "policy"
question = "Як за нашою базовою позицією індексується орендна плата?"
evidence = [
  { doc = "policy_2026", quote = "індексується на більший із двох показників: ІСЦ за попередній календарний рік або 3 %" },
]

[[question]]
id = "r02"
kind = "policy"
question = "Орендар пропонує обмежити щорічну індексацію 6 %. Чи можемо ми це погодити?"
evidence = [
  { doc = "policy_2026", quote = "граничний розмір щорічної індексації — не менше 10 %" },
  { doc = "clause_library_2026", quote = "Граничний розмір не може бути меншим за 10 %" },
]

[[question]]
