# qwen3-8b-t07-capped with prompt v3: the sampling pair of qwen3-8b-t0-capped-v3,
# run on the current pipeline so that temperature and top_p are compared on equal terms.
name = "qwen3-8b-t07-capped-v3"
provider = "ollama"
model = "qwen3:8b"
prompt = "extraction/v3"
max_tokens = 4000
timeout_s = 900
max_retries = 2
context_tokens = 32768
max_red_flags = 8

[sampling]
temperature = 0.7
top_p = 0.8
repeat_penalty = 1.1
