# qwen3-8b-t0 with the fixes for looping on the red flag list:
# the decoding grammar allows at most 8 flags, and repeated tokens are penalized.
name = "qwen3-8b-t0-capped-v3"
provider = "ollama"
model = "qwen3:8b"
prompt = "extraction/v3"
max_tokens = 4000
timeout_s = 900
max_retries = 2
context_tokens = 32768
max_red_flags = 8

[sampling]
temperature = 0.0
top_p = 1.0
repeat_penalty = 1.1
